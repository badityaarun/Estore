<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Administration Login</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="card">

    <h1>Administration Login</h1>

    <p class="subtitle">
        Enter your credentials to continue.
    </p>

    <form action="alog" method="post">

        <label>User ID</label>
        <input type="text" name="uname" class="input-box">

        <label>Password</label>
        <input type="password" name="pword" class="input-box">

        <input type="submit" value="Login" class="btn admin-btn">

    </form>

</div>

</body>
</html>
